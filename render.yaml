services:
  - type: web
    name: eventful-api
    runtime: node

    buildCommand: |
      npm install
      npx prisma generate
      npx prisma migrate deploy
      npm run build

    startCommand: node dist/src/server.js

    envVars:
      - key: NODE_VERSION
        value: 22

      - key: NODE_ENV
        value: production

      - key: JWT_EXPIRES_IN
        value: 1d

      - key: BCRYPT_SALT_ROUNDS
        value: 12
